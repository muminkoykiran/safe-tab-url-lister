name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate manifest.json
        run: |
          python3 -c "
          import json, sys
          browsers = ['chrome', 'firefox', 'safari', ]
          for browser in browsers:
            with open('src/manifest/manifest.{}.json'.format(browser)) as f:
                m = json.load(f)
            assert m['manifest_version'] == 3, 'Must be Manifest V3'
            assert 'name' in m, 'name required'
            assert 'version' in m, 'version required'
            assert 'default_locale' in m, 'default_locale required for i18n'
            print('manifest.chrome.json OK — MV3, version:', m['version'])
          "

      - name: Validate _locales
        run: |
          python3 -c "
          import json, os, sys
          locales = ['en', 'tr']
          for loc in locales:
              path = f'src/_locales/{loc}/messages.json'
              with open(path) as f:
                  data = json.load(f)
              keys = list(data.keys())
              print(f'{loc}: {len(keys)} keys OK')
          # Check all English keys exist in Turkish
          with open('src/_locales/en/messages.json') as f:
              en = json.load(f)
          with open('src/_locales/tr/messages.json') as f:
              tr = json.load(f)
          missing = [k for k in en if k not in tr]
          if missing:
              print('Missing Turkish translations:', missing)
              sys.exit(1)
          print('All EN keys present in TR')
          "

      - name: Check required files
        run: |
          for f in build.sh pkg.sh generate-icons.js; do
            [ -f "scripts/$f" ] && echo "OK: $f" || (echo "MISSING: scripts/$f" && exit 1)
          done
          for f in LICENSE README.md CHANGELOG.md; do
            [ -f "$f" ] && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
          for f in popup.html popup.css popup.js; do
            [ -f "src/$f" ] && echo "OK: $f" || (echo "MISSING: src/$f" && exit 1)
          done
          for f in chrome firefox safari; do
            [ -f "src/manifest/manifest.$f.json" ] && echo "OK: manifest.$f.json" || (echo "MISSING: src/manifest/manifest.$f.json" && exit 1)
          done
          for size in 16 48 128; do
            [ -f "src/icons/icon${size}.png" ] && echo "OK: icon${size}.png" || (echo "MISSING: src/icons/icon${size}.png" && exit 1)
          done

      - name: Build zip (dry run)
        run: |
          [ -f ./extensions/safe-tab-url-lister-chrome-test-build.zip ] && rm ./extensions/safe-tab-url-lister-chrome-test-build.zip
          ./scripts/pkg.sh chrome test-build
          ls -lh ./extensions/safe-tab-url-lister-chrome-test-build.zip
          [ -f ./extensions/safe-tab-url-lister-chrome-test-build.zip ] && echo "Build OK" || (echo "Test Build Not Found" && exit 1)

      - name: Validate version consistency across docs
        run: |
          python3 -c "
          import json, re, sys

          browsers = ['chrome', 'firefox', 'safari']
          versions = set()
          for browser in browsers:
              with open('src/manifest/manifest.{}.json'.format(browser)) as f:
                  versions.add(json.load(f)['version'])
          assert len(versions) == 1, f'Manifests disagree on version: {versions}'
          version = versions.pop()
          print('Manifest version:', version)

          with open('CHANGELOG.md') as f:
              changelog = f.read()
          m = re.search(r'## \[(\d+\.\d+\.\d+)\]', changelog)
          assert m, 'No [x.y.z] heading found in CHANGELOG.md'
          assert m.group(1) == version, f'CHANGELOG top entry [{m.group(1)}] does not match manifest version {version}'
          print('CHANGELOG top entry matches:', m.group(1))

          with open('README.md') as f:
              readme = f.read()
          m = re.search(r'Chrome%20Web%20Store-v(\d+\.\d+\.\d+)-blue', readme)
          assert m, 'No Chrome Web Store badge found in README.md'
          assert m.group(1) == version, f'README badge v{m.group(1)} does not match manifest version {version}'
          print('README badge matches:', m.group(1))

          with open('docs/index.html') as f:
              landing = f.read()
          m = re.search(r'\"softwareVersion\":\s*\"(\d+\.\d+\.\d+)\"', landing)
          assert m, 'No softwareVersion found in docs/index.html JSON-LD'
          assert m.group(1) == version, f'docs/index.html softwareVersion {m.group(1)} does not match manifest version {version}'
          print('docs/index.html softwareVersion matches:', m.group(1))

          with open('src/_locales/en/messages.json') as f:
              en = json.load(f)
          desc = en['appDescription']['message']
          assert len(desc) <= 132, f'appDescription is {len(desc)} chars, over the 132-char Chrome Web Store summary limit'
          print(f'appDescription OK — {len(desc)}/132 chars')
          "
