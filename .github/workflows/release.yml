name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)build a release for, e.g. v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="$DISPATCH_TAG"
          else
            RAW_TAG="$PUSHED_TAG"
          fi
          if ! [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RAW_TAG' does not match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "TAG=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.tag.outputs.TAG }}

      - name: Build extension zip
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          ./scripts/pkg.sh all "$TAG"

      - name: Extract changelog entry
        id: changelog
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          awk -v ver="$VERSION" '$0 == "## [" ver "]" || $0 ~ ("^## \\[" ver "\\] ") {flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION — refusing to publish an empty release body"
            exit 1
          fi
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Safe Tab URL Lister ${{ steps.tag.outputs.TAG }}
          body_path: release_notes.md
          files: |
            extensions/safe-tab-url-lister-chrome-${{ steps.tag.outputs.TAG }}.zip
            extensions/safe-tab-url-lister-firefox-${{ steps.tag.outputs.TAG }}.zip
          draft: true
          prerelease: false
